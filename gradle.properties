# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.5
yarn_mappings=1.21.5+build.1
loader_version=0.17.2
loom_version=1.11-SNAPSHOT

# Mod Properties
mod_version=1.1.2+1.21.5
maven_group=io.github.piscescup
archives_base_name=pc_develop_lib
mod_name="PiscesCup Develop Lib"
description="This is a library for simple developing."
org.gradle.project.name="PiscesCup Develop Lib"

# Dependencies
# Fabric API
fabric_version=0.128.2+1.21.5

version=${mod_version}-fabric_${fabric_api_version}-mc_${minecraft_version}

artifact_name=${mod_name}-${version}

systemProp.org.gradle.internal.publish.checksums.insecure=true
